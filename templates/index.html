<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pencarian Wilayah (Prov/Kab/Kec/Desa)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

  <style>
    body { background:#f6f7fb; }
    .box { background:#fff; padding:1.25rem; border-radius:.5rem; box-shadow:0 6px 18px rgba(0,0,0,.04); }
    .autocomplete-list { max-height:260px; overflow:auto; z-index:2000; }
    .position-relative { position:relative; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="box">
      <h4 class="mb-3">🔎 Pencarian Wilayah Indonesia</h4>

      <!-- Input Pencarian -->
      <div class="row gy-3">
        <div class="col-md-3 position-relative">
          <label class="form-label">Provinsi</label>
          <input id="search-provinsi" class="form-control" placeholder="Ketik provinsi...">
          <ul id="list-provinsi" class="list-group mt-1 autocomplete-list position-absolute w-100"></ul>
        </div>

        <div class="col-md-3 position-relative">
          <label class="form-label">Kabupaten / Kota</label>
          <input id="search-kabupaten" class="form-control" placeholder="Ketik kabupaten/kota...">
          <ul id="list-kabupaten" class="list-group mt-1 autocomplete-list position-absolute w-100"></ul>
        </div>

        <div class="col-md-3 position-relative">
          <label class="form-label">Kecamatan</label>
          <input id="search-kecamatan" class="form-control" placeholder="Ketik kecamatan...">
          <ul id="list-kecamatan" class="list-group mt-1 autocomplete-list position-absolute w-100"></ul>
        </div>

        <div class="col-md-3 position-relative">
          <label class="form-label">Desa / Kelurahan</label>
          <input id="search-desa" class="form-control" placeholder="Ketik desa/kelurahan...">
          <ul id="list-desa" class="list-group mt-1 autocomplete-list position-absolute w-100"></ul>
        </div>
      </div>

      <!-- Hasil Terpilih -->
      <div id="hasil" class="mt-4" style="display:none;">
        <div class="card p-3">
          <h6>📋 Detail Wilayah Terpilih</h6>
          <p class="mb-1"><strong>Provinsi:</strong> <span id="prov"></span> <code id="kode-prov"></code></p>
          <p class="mb-1"><strong>Kab/Kota:</strong> <span id="kab"></span> <code id="kode-kab"></code></p>
          <p class="mb-1"><strong>Kecamatan:</strong> <span id="kec"></span> <code id="kode-kec"></code></p>
          <p class="mb-2"><strong>Desa/Kel:</strong> <span id="desa"></span> <code id="kode-desa"></code></p>

          <button id="btn-copy" class="btn btn-outline-primary btn-sm mt-2">📋 Copy Kode</button>
          <p id="copy-success" class="text-success small mt-2 mb-0" style="display:none">✓ Kode berhasil disalin</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
